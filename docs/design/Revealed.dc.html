<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5E","options":["#0B7A5E","#3446D6","#0B6BCB","#6B3FD1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgba(hex, a) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return 'rgba(11, 122, 94, ' + a + ')';
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var accent = this.props.accent ?? '#0B7A5E';
    return {
      accent: accent,
      accentTint: this.rgba(accent, 0.1),
      copied: !!s.copied,
      notCopied: !s.copied,
      copy: function () { self.setState({ copied: true }); }
    };
  }
}
</script>
